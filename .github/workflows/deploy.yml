name: "Deploy Godot WebGL to GitHub Pages"

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export_web:
    name: Export WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Export WebGL with Godot
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          godot_export_templates_download_url: "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          relative_project_path: "./"
          export_debug: false

      - name: Add COOP/COEP Service Worker for SharedArrayBuffer
        run: |
          EXPORT_DIR="$HOME/.local/share/godot/export/Web"
          curl -s https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.js > "$EXPORT_DIR/coi-serviceworker.js"
          sed -i 's/<head>/<head><script src="coi-serviceworker.js"><\/script>/g' "$EXPORT_DIR/index.html"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "${{ env.HOME }}/.local/share/godot/export/Web"

  deploy:
    name: Deploy to Pages
    needs: export_web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
